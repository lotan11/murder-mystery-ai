name: Agent network coordination

on:
  schedule:
    - cron: '23 */4 * * *'
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ['Prototype checks']
    types: [completed]
  workflow_dispatch:

# Only the coordination job can write issues/review requests. No job can write
# repository contents, merge a branch, approve a PR or deploy the application.
permissions: {}

concurrency:
  group: agent-network-${{ github.repository }}
  cancel-in-progress: false

jobs:
  coordinate:
    # Dashboard writes must not feed back into another dashboard write. Changes
    # made with GITHUB_TOKEN do not normally trigger workflows; this also guards
    # actor recursion and human edits to the generated dashboard issue.
    if: >-
      (github.event_name != 'issues' ||
       (github.actor != 'github-actions[bot]' &&
        !contains(github.event.issue.body, '<!-- agent-network-key:dashboard -->')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      checks: read
    steps:
      - name: Check out trusted coordinator only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconcile GitHub tasks and readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m agent_network sync --write --output .agent-network/status.json
      - name: Retain machine-readable coordination snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-network-status-${{ github.run_id }}
          path: .agent-network/status.json
          if-no-files-found: warn
          retention-days: 14
