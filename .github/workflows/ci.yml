name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest backend/tests -q
      - run: python -m pytest tests/agent_network -q
      - name: Exercise coordinator against live GitHub without writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m agent_network sync --output .agent-network/ci-status.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-network-readiness
          path: .agent-network/ci-status.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
